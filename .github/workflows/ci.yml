# 変更を押したときと、変更の提案（プルリクエスト）のたびに、テストと clippy を動かす。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # 新しい Rust が出るたびに clippy の決まりが増えて落ちないよう、確かめた版に固定する（上げるときは、ここと release.yml を一緒に）。
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
