[package]
name = "pakenoba-app"
description = "パケノバ: パッケージデザイン専用の制作ソフト"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pakenoba"
path = "src/main.rs"

[dependencies]
# 画面の文字の多言語化（英語を基準に、言語ごとの訳の表から引く）。
pakenoba-i18n = { path = "../pakenoba-i18n" }
pakenoba-core = { path = "../pakenoba-core" }
# egui と eframe は本家（crates.io）の版。試作 S01 の結果による。
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "system_fonts", "clipboard", "x11", "wayland"] }
bytemuck = { version = "1", features = ["derive"] }
# 柄にする画像（PNG）の読み込み。
png = "0.18"
# 文字の柄。OS のフォントを探し（fontique）、読み（skrifa）、描く（vello_cpu）。どれも egui が使っている部品と同じ版。
fontique = "0.11.1"
skrifa = "0.44.0"
vello_cpu = { version = "0.2.0", default-features = false, features = ["std", "u8_pipeline", "text"] }
# 書き出し: 箱開けの動画（GIF）と、実寸の型紙（PDF。絵は flate2 で圧縮して入れる）。
gif = "0.14.2"
pdf-writer = "0.15.0"
flate2 = "1.1.11"
# 柄にする画像（JPEG）の読み込み。
zune-jpeg = "0.5.15"
# craft-libs は同じコミットにそろえる（混ぜると同じ型が二重になる）。
craft-psd = { git = "https://github.com/storytold/craft-libs", rev = "ba25ccd233934d1b2f74e3c0f235168bf5f13ef3" }
# ベクターの柄（SVG）を読んで描く。Craft のアプリが共有する、制限つきの usvg と resvg（0.48.1）。
# コミットは、下の vectorcraft-trace が使う craft-libs（craft-image-codecs）とそろえる。
craft-svg = { git = "https://github.com/storytold/craft-libs", rev = "ba25ccd233934d1b2f74e3c0f235168bf5f13ef3", features = ["tree-render"] }
# 画像のベクター化。VectorCraft の画像トレース（Illustrator の画像トレースにならったもの）を、部品としてそのまま使う。
vectorcraft-trace = { git = "https://github.com/storytold/vectorcraft", rev = "db9acab4da715945ea12c865e6ec54a5589588c9" }
# 案件をまたぐ設定（コレクションの登録）を、人が読める形で覚える。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
keyring = { version = "3.6.3", features = ["windows-native", "apple-native", "linux-native"] }
toml = "1"
# ファイルを開く、保存するときの、OS のダイアログ。
rfd = "0.18"
# 素材を取り込んだ日時（その土地の時刻）。
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
# のぞき込み（出力）: Web カメラで顔を見つけ、画面の向こうの箱をのぞき込めるようにする。
# 顔と目の検出は、MediaPipe BlazeFace（Apache-2.0。モデルは assets/ に同梱）を、Rust だけで書かれた tract で動かす。
tract-onnx = "0.23.10"
ureq = "3"
# 見本パック（ZIP）を広げる。pakenoba-core と同じ版。
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 景色の絵を、GPU の半精度の数にする。
half = "2"
sha2 = "0.11"

# Web カメラの映像。JPEG のほどき（mozjpeg、C の部品）は使わず、zune-jpeg でほどく。
[target.'cfg(windows)'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }
[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-v4l"] }
[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-avfoundation"] }

[dev-dependencies]
# シェーダーの文法と型を、GPU なしで試験する（wgpu と同じ版）。
naga = { version = "30.0.2", features = ["wgsl-in"] }
